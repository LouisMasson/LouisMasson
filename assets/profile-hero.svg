<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Louis Masson — Sales, Engineering and AI</title>
  <desc id="desc">Terminal-inspired profile banner about turning business problems into useful products.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#334155"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>

  <circle cx="34" cy="30" r="5" fill="#fb7185"/>
  <circle cx="54" cy="30" r="5" fill="#fbbf24"/>
  <circle cx="74" cy="30" r="5" fill="#34d399"/>
  <text x="96" y="35" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">louis@github: ~/profile</text>
  <path d="M24 55H1176" stroke="#334155"/>

  <text x="64" y="121" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">HELLO, I'M</text>
  <text x="60" y="179" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="52" font-weight="700" letter-spacing="-2">LOUIS MASSON</text>
  <rect x="64" y="199" width="490" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="64" y="235" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">SALES × ENGINEERING × AI</text>
  <text x="64" y="273" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">&gt; turning business problems into useful products_</text>

  <g transform="translate(835 95)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="296" height="142" rx="14" fill="#0f172a" fill-opacity=".88" stroke="#334155"/>
    <text x="24" y="37" fill="#60a5fa" font-size="13">01</text>
    <text x="62" y="37" fill="#e2e8f0" font-size="15">UNDERSTAND</text>
    <text x="24" y="75" fill="#a78bfa" font-size="13">02</text>
    <text x="62" y="75" fill="#e2e8f0" font-size="15">BUILD</text>
    <text x="24" y="113" fill="#34d399" font-size="13">03</text>
    <text x="62" y="113" fill="#e2e8f0" font-size="15">SHIP &amp; OPERATE</text>
  </g>
</svg>
